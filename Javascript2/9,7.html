<body>
    <h1>del 9,7</h1>

<script>
    const tall = [8, 3, 12, 7, 5];

    for (let i = 0; i < tall.length; i++) {
        for (let j = 0; j < tall.length; j++) {

            if (tall[i] < tall[j]) {
                let temp = tall[i];
                tall[i] = tall[j];
                tall[j] = temp;
            }
        }
    }

    console.log(tall);
</script>
</body>
</html>

<!--For å sammenligne tallene med hverandre og få dem sortert-->
<!--Den holder på et tall mens vi bytter to tall-->
<!--Da sorteres tallene fra størst til minst-->
